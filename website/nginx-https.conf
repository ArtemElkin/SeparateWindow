server {
    listen 80;
    listen [::]:80;
    server_name separate.maark.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/separate-window/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://separate.maark.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name separate.maark.ru;

    ssl_certificate /etc/letsencrypt/live/separate.maark.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/separate.maark.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    include /opt/separate-window/current/nginx-site.conf;
}
