root /opt/separate-window/current/public;
index index.html;
server_tokens off;

add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

error_page 404 /404.html;
location = /404.html {
    internal;
}

location / {
    try_files $uri $uri/ =404;
}
